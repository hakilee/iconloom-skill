    <rect height="2" rx="1" width="9" x="3.5" y="12" opacity="1" fill="none" stroke="#CE7D32" stroke-width="1" stroke-linejoin="round" clip-path="url(#desk-lamp-dark-layer-0-clip)" data-part="edge" />
  </g>
  <path d="M7.5 12.5 L7.5 9 L9 7" fill="none" stroke="#DBE5FF" opacity="1" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" data-part="line" />
  <g opacity="0.86" data-layer="1">
    <path d="M4.5 6.5 L7 2.5 Q7.5 2 8 2.5 L12.5 6.5 Q13 7.5 12 7.5 L5 7.5 Q4 7.5 4.5 6.5 Z" fill="url(#desk-lamp-dark-layer-1-paint)" data-part="fill" filter="url(#desk-lamp-dark-layer-1-inset)" />
    <path d="M4.5 6.5 L7 2.5 Q7.5 2 8 2.5 L12.5 6.5 Q13 7.5 12 7.5 L5 7.5 Q4 7.5 4.5 6.5 Z" opacity="1" fill="none" stroke="#CE7D32" stroke-width="1" stroke-linejoin="round" clip-path="url(#desk-lamp-dark-layer-1-clip)" data-part="edge" />
