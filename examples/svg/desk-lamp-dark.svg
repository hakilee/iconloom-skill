<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none" role="img" aria-labelledby="desk-lamp-dark-title" data-profile="pack-layered">
  <title id="desk-lamp-dark-title">Desk lamp</title>
  <defs>
    <linearGradient id="desk-lamp-dark-layer-0-paint" x1="0.15" y1="0" x2="0.85" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#FFB455" />
      <stop offset="1" stop-color="#FF9C2C" />
    </linearGradient>
    <clipPath id="desk-lamp-dark-layer-0-clip" clipPathUnits="userSpaceOnUse">
      <rect height="2" rx="1" width="9" x="3.5" y="12" />
    </clipPath>
    <filter id="desk-lamp-dark-layer-0-inset" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="1.4" dy="0.9" result="shift" />
      <feGaussianBlur in="shift" stdDeviation="1.1" result="blur" />
      <feComposite in="SourceAlpha" in2="blur" operator="out" result="rim" />
      <feFlood flood-color="#FFFFFF" flood-opacity="0.24" result="tint" />
      <feComposite in="tint" in2="rim" operator="in" result="light" />
      <feMerge>
        <feMergeNode in="SourceGraphic" />
        <feMergeNode in="light" />
      </feMerge>
    </filter>
    <linearGradient id="desk-lamp-dark-layer-1-paint" x1="0.15" y1="0" x2="0.85" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#FFB455" />
      <stop offset="1" stop-color="#FF9C2C" />
    </linearGradient>
    <clipPath id="desk-lamp-dark-layer-1-clip" clipPathUnits="userSpaceOnUse">
      <path d="M4.5 6.5 L7 2.5 Q7.5 2 8 2.5 L12.5 6.5 Q13 7.5 12 7.5 L5 7.5 Q4 7.5 4.5 6.5 Z" />
    </clipPath>
    <filter id="desk-lamp-dark-layer-1-inset" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="1.4" dy="0.9" result="shift" />
      <feGaussianBlur in="shift" stdDeviation="1.1" result="blur" />
      <feComposite in="SourceAlpha" in2="blur" operator="out" result="rim" />
      <feFlood flood-color="#FFFFFF" flood-opacity="0.24" result="tint" />
      <feComposite in="tint" in2="rim" operator="in" result="light" />
      <feMerge>
        <feMergeNode in="SourceGraphic" />
