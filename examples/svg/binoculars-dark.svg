      <feGaussianBlur in="shift" stdDeviation="1.1" result="blur" />
      <feComposite in="SourceAlpha" in2="blur" operator="out" result="rim" />
      <feFlood flood-color="#FFFFFF" flood-opacity="0.24" result="tint" />
